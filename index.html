<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹사이트 과제</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- 1. 본문 영역[cite: 1] -->
        <div class="main-section">
            <h1>1. 본문 영역</h1>
            
            <!-- 2. 내용 영역 (마우스 휠 스크롤 적용)[cite: 1] -->
            <div class="scroll-area">
                <div class="content-block">
                    <h2>제목 <span class="summary">간략한 요약</span></h2>
                    <a href="#full-content-1" class="content-link">
                        <div class="gradient-bg">
                            <!-- img 태그 필수 조건 충족용 (화면에는 보이지 않음) -->
                            <img src="dummy1.jpg" alt="첫 번째 콘텐츠 배경 이미지" class="hidden-img">
                        </div>
                    </a>
                </div>
                
                <br> <!-- br 태그 필수 조건 충족 -->

                <div class="content-block">
                    <h3>제목 <span class="summary">간략한 요약</span></h3>
                    <a href="#full-content-2" class="content-link">
                        <div class="gradient-bg">
                            <img src="dummy2.jpg" alt="두 번째 콘텐츠 배경 이미지" class="hidden-img">
                        </div>
                    </a>
                </div>

                <!-- ul, ol, li 태그 필수 조건 충족을 위한 부가 정보 영역 -->
                <div class="list-area">
                    <p>추가 정보 목록</p>
                    <ul>
                        <li>본문 영역의 여러 컨텐츠 중 하나입니다.</li>
                    </ul>
                    <ol>
                        <li>클릭 시 전체 내용을 확인할 수 있습니다.</li>
                    </ol>
                </div>
            </div>
        </div>

        <!-- 5. 사이드 메뉴[cite: 1] -->
        <div class="side-menu">
            <h2>5. 사이드 메뉴</h2>
            <div class="menu-flex-container">
                <!-- 4. 트렌드 구역[cite: 1] -->
                <a href="#trend" class="btn">트렌드</a>
                <!-- 3. 설정 구역[cite: 1] -->
                <a href="#settings" class="btn">사이트 설정 및 시대 설정</a>
            </div>
        </div>

        <!-- 구성 해설 표[cite: 1] -->
        <table class="info-table">
            <tr>
                <th rowspan="5">구성 해설</th>
                <td>1. 본문 영역: 여러 컨텐츠가 나열된 영역</td>
            </tr>
            <tr>
                <td>2. 내용 영역: 전체 내용 중 일부만 본문 영역에 표시</td>
            </tr>
            <tr>
                <td>3. 설정 구역: 사용자의 사이트 개인 설정</td>
            </tr>
            <tr>
                <td>4. 트렌드 구역: 조회수가 높은 내용 표시</td>
            </tr>
            <tr>
                <td>5. 사이드 메뉴: 트렌드와 설정 구역을 품은 영역</td>
            </tr>
        </table>
    </div>
</body>
</html>
